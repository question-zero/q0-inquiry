# prompt: Roadmap step 11: the issue form specified in proposals/2026-09-24-claude-opus-5-5-contributing.md (revision 2, reviewed by GPT-6 in topic contributing); the founder chose its recommendations, verbatim: "go with your recommendations on all of them".
# license: MIT (LICENSE-CODE)
name: Contribution (for people who can't use git)
description: Paste a contribution. The editor copies it verbatim into a file and records the relay.
title: "Contribution: <short title>"
body:
  - type: markdown
    attributes:
      value: |
        ## Before you submit: what becomes public

        - **This issue is public the moment you submit it,** with your GitHub account name, whether or not it is ever merged.
        - **A pseudonymous handle doesn't hide your GitHub account.** To stay unidentified, use an account that doesn't identify you.
        - **Don't include anyone's private information, or any secret such as an API key.** Check pasted model outputs and transcripts for both. To report private information or a secret already in the repository, use the private contact in the README, not an issue.
        - **Git history is permanent in practice.** See `CONTRIBUTING.md` and `moderation/rules.md`.

        The editor copies your contribution **verbatim**, marks any provenance the editor adds as the editor's, and never invents provenance. Label anything you don't know `unknown`.
  - type: dropdown
    id: form
    attributes:
      label: How are you providing provenance?
      options:
        - I am pasting a complete file with its front matter (below)
        - I am filling in the provenance fields (below)
    validations:
      required: true
  - type: textarea
    id: complete_file
    attributes:
      label: Complete file with front matter (if you chose that option)
      description: The whole file, starting with the '---' line. See the templates in CONTRIBUTING.md.
      render: markdown
  - type: dropdown
    id: type
    attributes:
      label: Type of contribution
      options:
        - critique or response
        - proposal
        - proposition
        - case
        - open question
        - simulation
        - assessment of a proposition version
  - type: input
    id: title
    attributes:
      label: Title
  - type: input
    id: handle
    attributes:
      label: Your name or handle (recorded as human/<handle>)
  - type: textarea
    id: contribution
    attributes:
      label: The contribution text
      description: Copied verbatim.
  - type: markdown
    attributes:
      value: |
        **For an assessment of a proposition version** (if you are not pasting a complete file), fill in the next four fields. The editor records your position exactly as you give it and never infers one from your text.
  - type: input
    id: target
    attributes:
      label: "Assessment: the exact version you assess (path @ commit)"
      description: For example propositions/p001-no-initiated-destruction.md @ <commit>. See index.md for the versions assessed so far.
  - type: dropdown
    id: position
    attributes:
      label: "Assessment: your position on that version as written"
      options:
        - support
        - reject
        - conditional
        - uncertain
  - type: textarea
    id: conditions
    attributes:
      label: "Assessment: conditions (required if your position is conditional)"
  - type: textarea
    id: basis
    attributes:
      label: "Assessment: basis (your reasons, or links to them)"
  - type: textarea
    id: responds_to
    attributes:
      label: What it responds to, if anything (path @ commit where possible)
  - type: textarea
    id: exposure
    attributes:
      label: What you (or the system) had seen
  - type: textarea
    id: prompt
    attributes:
      label: For AI output, the exact prompt; otherwise how it came about
  - type: input
    id: run
    attributes:
      label: "Run (for AI output: application, session or conversation ID, date; for people: when you wrote it)"
  - type: textarea
    id: ai_details
    attributes:
      label: For AI output only
      description: Model identifier and developer, application and settings, and how you know which model ran. You are the operator.
  - type: textarea
    id: interventions
    attributes:
      label: Human interventions and samples
      description: What you edited or selected, and how many outputs were generated versus submitted.
  - type: checkboxes
    id: consent
    attributes:
      label: License and publication
      options:
        - label: I license this contribution under CC BY 4.0 (text) and MIT (code), for any rights I hold, as CONTRIBUTING.md describes. For AI output, I am its operator and make this grant.
          required: true
        - label: I understand what becomes public, as described above and in CONTRIBUTING.md, and I consent to publication.
          required: true

# license: MIT (LICENSE-CODE)
#
# Runs tools/check_headers.py and its tests on every pull request and on pushes
# to main. The workflow requests only read access, and it uses pull_request, not
# pull_request_target. Under GitHub's default settings, pull requests from forks
# therefore get a read-only token and no secrets. Repository or organization
# Actions settings can change that, so they should be checked before launch.
# A passing run doesn't replace review of changes to the checker itself.
name: Check provenance headers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      - run: git config --global user.email "ci@example.invalid" && git config --global user.name "ci"
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: python tools/check_headers.py
      - run: python tools/build_index.py --tree --check

# prompt: D2 of proposals/2026-09-26-claude-opus-5-5-github-automation.md (revision 3, cleared at design level by GPT-6). Advisory feedback on Round 3 issues and pull requests. NOT ACTIVE: it is kept in tools/workflows/, where GitHub does not run it. After GPT-6's code review, the separately authorized sandbox test and the founder's adoption (which must cover this workflow's change in operating security posture), the founder installs it in .github/workflows/ through their own account and sets the repository variable Q0_ROUND3_FEEDBACK to `on`. Either step alone does nothing.
# license: MIT (LICENSE-CODE)
#
# Security boundary (proposal, D2, GPT-6 GA3):
# - Runs only trusted code from the default branch. It never checks out, installs, imports or runs anything from a
#   pull request; response files are fetched through the API as data by tools/round_03_feedback_job.py.
# - pull_request_target and issues give this workflow the base repository's context. That is why no step reads
#   event fields through ${{ }} in a shell; the job script reads the event payload file as JSON.
# - The parse job has read-only permissions and no write token. The publish job receives only the typed result,
#   holds only comment permissions, re-reads the item, and renders from fixed templates.
# - No secrets and no App key are used. Actions are pinned to commit SHAs.
# - The job names differ from the required `check`; this workflow never sets a required status and never blocks.
name: Round 3 advisory feedback

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "rounds/03-open/responses/**"

permissions: {}

concurrency:
  group: round-3-feedback-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  parse:
    # Issues from the Round 3 form carry these headings; the check is a routing hint, not proof of origin.
    if: >-
      vars.Q0_ROUND3_FEEDBACK == 'on' &&
      (github.event_name == 'pull_request_target' ||
       (contains(github.event.issue.body, '### Which text was answered?') &&
        contains(github.event.issue.body, '### The answer')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      result: ${{ steps.validate.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      - id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/round_03_feedback_job.py parse

  publish:
    needs: parse
    if: vars.Q0_ROUND3_FEEDBACK == 'on' && needs.parse.outputs.result != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.parse.outputs.result }}
        run: python tools/round_03_feedback_job.py publish
